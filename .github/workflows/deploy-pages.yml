name: Deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore workloads
        run: dotnet workload restore

      - name: Publish
        run: dotnet publish PortfolioSite.csproj -c Release -o publish

      - name: Configure base path for GitHub Pages
        shell: pwsh
        run: |
          $repoName = Split-Path $env:GITHUB_REPOSITORY -Leaf
          $indexPath = 'publish/wwwroot/index.html'
          $baseHref = "/$repoName/"
          $content = Get-Content $indexPath -Raw
          $content = $content.Replace('<base href="/" />', "<base href=\"$baseHref\" />")
          Set-Content $indexPath $content -Encoding utf8
          Copy-Item $indexPath 'publish/wwwroot/404.html'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
